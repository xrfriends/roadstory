openapi: 3.1.0
info:
  title: Road Story API
  version: 0.1.0
  description: API contract for Road Story consumer and journey features.
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
tags:
  - name: Stories
  - name: Journeys
  - name: Courses
  - name: Users
  - name: Reports
paths:
  /v1/stories/nearby:
    get:
      security: []
      tags: [Stories]
      operationId: getNearbyStories
      summary: Get published stories near the supplied location
      parameters:
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - name: heading
          in: query
          description: Travel bearing clockwise from north. Used only with a speed of at least 3 m/s to deprioritize stories more than 50 meters behind the vehicle.
          schema:
            type: number
            minimum: 0
            maximum: 360
        - name: speedMps
          in: query
          description: Current travel speed in meters per second when known.
          schema:
            type: number
            minimum: 0
        - name: radiusMeters
          in: query
          schema:
            type: integer
            minimum: 100
            maximum: 5000
            default: 1500
      responses:
        '200':
          description: Published stories within the requested radius, sorted by direction and distance. The request location is not included.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StorySummary'
        '400':
          $ref: '#/components/responses/Problem'
  /v1/stories/{storyId}:
    get:
      security: []
      tags: [Stories]
      operationId: getStory
      summary: Get published story detail
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Story detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryDetail'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/stories/{storyId}/audio:
    get:
      security: []
      tags: [Stories]
      operationId: getStoryAudio
      summary: Download the reviewed audio file for a published story
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Complete audio file
          headers:
            Content-Length:
              schema:
                type: integer
            ETag:
              schema:
                type: string
          content:
            audio/mp4:
              schema:
                type: string
                format: binary
        '304':
          description: The audio file matches If-None-Match
        '404':
          $ref: '#/components/responses/Problem'
  /v1/journeys/destination-playlist:
    post:
      security: []
      tags: [Journeys]
      operationId: createDestinationPlaylist
      summary: Compose a playlist for the confirmed destination and remaining drive time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationPlaylistRequest'
      responses:
        '200':
          description: Composed playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationPlaylist'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          description: The supplied route shape could not be used.
          $ref: '#/components/responses/Problem'
  /v1/courses:
    get:
      security: []
      tags: [Courses]
      operationId: listCourses
      summary: List published theme courses
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Courses
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseSummary'
                  nextCursor:
                    type: [string, 'null']
  /v1/courses/{courseId}:
    get:
      security: []
      tags: [Courses]
      operationId: getCourse
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/users/me/library:
    get:
      tags: [Users]
      operationId: getMyLibrary
      summary: Get the authenticated user's saved items and recent listening history
      responses:
        '200':
          description: Account library snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLibrary'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/users/me/preferences:
    get:
      tags: [Users]
      operationId: getPreferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Users]
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/users/me/saved-stories/{storyId}:
    put:
      tags: [Users]
      operationId: saveStory
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Saved
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Users]
      operationId: unsaveStory
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
  /v1/users/me/saved-courses/{courseId}:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Users]
      operationId: saveCourse
      responses:
        '204':
          description: Saved
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Users]
      operationId: unsaveCourse
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
  /v1/users/me/listening-history/{storyId}:
    put:
      tags: [Users]
      operationId: recordListening
      summary: Record the latest listening start for a published Story
      description: Repeating a request is safe. An older timestamp does not replace a newer listening record.
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playedAt]
              properties:
                playedAt:
                  type: string
                  format: date-time
                  description: Timestamp on or after 1970-01-01 UTC, at most five minutes ahead of server time.
      responses:
        '204':
          description: Listening history recorded
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/reports/content:
    post:
      tags: [Reports]
      operationId: reportContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentReportRequest'
      responses:
        '202':
          description: Report accepted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Latitude:
      name: latitude
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
    Longitude:
      name: longitude
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
  responses:
    Problem:
      description: Problem Details error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    SourceReference:
      type: object
      required: [title, reliabilityGrade]
      properties:
        organization:
          type: string
        title:
          type: string
        url:
          type: [string, 'null']
          format: uri
        reliabilityGrade:
          type: string
          enum: [A, B, C, D, E]
    StorySummary:
      type: object
      required:
        [id, title, placeName, category, distanceMeters, durationSeconds]
      properties:
        id:
          type: string
        title:
          type: string
        placeName:
          type: string
        category:
          type: string
        familyFriendly:
          type: boolean
          description: true인 Story를 가족 우선 재생 후보에서 앞에 배치한다. false이거나 필드가 없으면 기본 우선순위를 적용한다.
        distanceMeters:
          type: integer
          description: Distance from the query point or to the route corridor when supplied. Zero in responses without a distance reference.
        durationSeconds:
          type: integer
        hook:
          type: string
        saved:
          type: boolean
    StoryDetail:
      allOf:
        - $ref: '#/components/schemas/StorySummary'
        - type: object
          required: [verificationStatus, reviewedAt, sources, fullText]
          properties:
            verificationStatus:
              type: string
              enum: [VERIFIED, PUBLISHED]
            reviewedAt:
              type: string
              format: date-time
            uncertaintyLabel:
              type: [string, 'null']
            sources:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/SourceReference'
            fullText:
              type: string
              minLength: 1
              description: Vehicle App이 PLEOS TextToSpeech SDK로 즉시 합성할 검수 완료 낭독문.
            imageUrls:
              type: array
              items:
                type: string
                format: uri
            audio:
              $ref: '#/components/schemas/StoryAudio'
    StoryAudio:
      type: object
      required: [url, contentType, byteLength, sha256, durationMs]
      description: Reviewed audio for the current published narration, when an audio file is available.
      properties:
        url:
          type: string
          pattern: '^/v1/stories/[A-Za-z0-9_-]{1,128}/audio$'
          description: Same-origin URL path for downloading the complete audio file.
        contentType:
          type: string
          enum: [audio/mp4]
        byteLength:
          type: integer
          minimum: 1
          maximum: 20971520
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Lowercase SHA-256 of the downloadable bytes, used to identify the audio version.
        durationMs:
          type: integer
          minimum: 1
          maximum: 3600000
    DestinationPlaylistRequest:
      type: object
      required: [destination, remainingDurationSeconds]
      properties:
        origin:
          $ref: '#/components/schemas/Coordinates'
          description: Required for a route shape. May be omitted when composing only from the destination.
        destination:
          $ref: '#/components/schemas/Coordinates'
        remainingDurationSeconds:
          type: integer
          minimum: 60
        mode:
          type: string
          enum: [SHORT, STANDARD, FAMILY]
          default: STANDARD
          description: SHORT uses a smaller audio budget. FAMILY uses only stories marked family friendly.
        routePolyline:
          type: [string, 'null']
          maxLength: 25000
          description: Remaining navigation route encoded as Polyline5. If absent or null, candidates are limited to the destination area.
    DestinationPlaylist:
      type: object
      required: [id, basis, totalAudioDurationSeconds, items]
      properties:
        id:
          type: string
        basis:
          type: string
          enum: [ROUTE, DESTINATION_NEARBY]
          description: ROUTE denotes candidates near the supplied route geometry. DESTINATION_NEARBY denotes candidates within 300 meters of the confirmed destination.
        totalAudioDurationSeconds:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/StorySummary'
    CourseSummary:
      type: object
      required: [id, title, durationSeconds, distanceMeters, stopCount, storyCount]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        coverImageUrl:
          type: [string, 'null']
          format: uri
        durationSeconds:
          type: integer
          description: Estimated course duration. For a single stop this is the available narration duration.
        distanceMeters:
          type: integer
          description: Approximate distance between course stops, zero for a single stop.
        stopCount:
          type: integer
        storyCount:
          type: integer
        familyFriendly:
          type: boolean
        offlineAvailable:
          type: boolean
    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          required: [stops]
          properties:
            stops:
              type: array
              items:
                type: object
                required: [sequence, placeName, coordinates]
                properties:
                  sequence:
                    type: integer
                  placeName:
                    type: string
                  coordinates:
                    $ref: '#/components/schemas/Coordinates'
                  storyIds:
                    type: array
                    items:
                      type: string
                  stories:
                    type: array
                    description: Published stories for this stop in playback order.
                    items:
                      $ref: '#/components/schemas/StorySummary'
    LibraryItem:
      type: object
      required: [id, title, subtitle]
      properties:
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        category:
          type: [string, 'null']
    ListeningHistoryItem:
      allOf:
        - $ref: '#/components/schemas/LibraryItem'
        - type: object
          required: [playedAt]
          properties:
            playedAt:
              type: string
              format: date-time
    UserLibrary:
      type: object
      required: [accountId, savedStories, savedCourses, history]
      properties:
        accountId:
          type: string
          description: Stable account identifier derived from the verified server session.
        savedStories:
          type: array
          items:
            $ref: '#/components/schemas/LibraryItem'
        savedCourses:
          type: array
          items:
            $ref: '#/components/schemas/LibraryItem'
        history:
          type: array
          maxItems: 100
          description: Most recent listening start per published Story, newest first.
          items:
            $ref: '#/components/schemas/ListeningHistoryItem'
    UserPreferences:
      type: object
      required: [categories, autoplay]
      properties:
        categories:
          type: object
          additionalProperties:
            type: string
            enum: [FREQUENT, SOMETIMES, NEVER]
        autoplay:
          type: boolean
        familyMode:
          type: boolean
    ContentReportRequest:
      type: object
      required: [storyId, reason]
      properties:
        storyId:
          type: string
        reason:
          type: string
          enum:
            [FACTUAL_ERROR, PRONUNCIATION, WRONG_LOCATION, MISTIMED, WORDING, COPYRIGHT, OTHER]
        details:
          type: string
          maxLength: 2000
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: roadstory
      POSTGRES_USER: roadstory
      POSTGRES_PASSWORD: roadstory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadstory -d roadstory"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - roadstory-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  roadstory-postgres:

